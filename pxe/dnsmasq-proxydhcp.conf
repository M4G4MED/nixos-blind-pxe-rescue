# proxyDHCP: router keeps handing leases; we only steer PXE boot files.
# Second-stage: iPXE sends DHCP option 175 -> serve boot.ipxe (TFTP), which
# then fetches bzImage+initrd from darkhttpd :8092.
port=0
interface=enp4s0
bind-interfaces
dhcp-range=192.0.2.1,proxy,255.255.255.0
enable-tftp
tftp-root=/srv/pxe-rescue/pxe/tftp
tftp-no-blocksize
log-dhcp
log-queries

# stage 2: iPXE -> boot script. Tag on the user-class STRING (proven present in
# the log: "user class: iPXE"); option-175 dhcp-match proved unreliable here.
dhcp-boot=tag:ipxe,boot.ipxe,,192.0.2.10
dhcp-userclass=set:ipxe,iPXE
dhcp-match=set:ipxe,175
pxe-service=tag:!ipxe,x86PC,"iPXE legacy",undionly.kpxe
pxe-service=tag:!ipxe,BC_EFI,"iPXE EFI",ipxe.efi
pxe-service=tag:!ipxe,x86-64_EFI,"iPXE EFI64",ipxe.efi
# NO pxe-service for tag:ipxe -- a pxe-service menu pushes iPXE into PXE
# discovery mode and it never loads boot.ipxe. dhcp-boot alone is what works
# (proven: iPXE fetched bzImage+initrd at 14:05 with exactly this shape).
